name: jev-effort-router
version: 0.7.0
manifest_version: 2
api_version: 1
description: Route user turns to the best model and reasoning effort via pluggable deciders (TypeSafe Jev or OpenAI-compatible).
author: AlphaPerseii3000 (forked by RVerdiF)
license: MIT
homepage: https://github.com/RVerdiF/jev-effort-router
tags: [routing, models, reasoning, ollama-cloud, decisions, opencode, anthropic, claude-subscription]
provides_middleware:
  - llm_request
provides_hooks:
  - on_session_end
  - post_llm_call
provides_tools:
  - jev_effort_router_status
  - jev_effort_router_route
config_schema:
  enabled:
    type: bool
    default: true
    label: Routing enabled
    description: Master switch. When off, the plugin registers but never rewrites a request.
  jev_model:
    type: str
    default: typesafe/jev-1.13
    label: Jev model
    description: Decision model id for the Jev backend. Use typesafe/jev-latest to follow the newest Jev release.
  endpoint:
    type: str
    default: https://openrouter.ai/api/alpha/decisions
    label: Jev decision endpoint
    description: TypeSafe Jev endpoint the `jev` decider POSTs to. Only the legacy `jev` decider reads it; `jev_console` and `openai_compatible` have their own URL settings.
  confidence_threshold:
    type: float
    default: 0.5
    label: Confidence threshold
    description: Below this, the turn keeps the statically configured model and effort.
  timeout_s:
    type: float
    default: 2.0
    label: Decider timeout (seconds)
    description: Budget for the decision call. Any timeout leaves the request untouched.
  default_model:
    type: str
    default: deepseek-v4.1-flash
    label: Fallback model
    description: Model used when the decision is below the confidence threshold.
  default_effort:
    type: str
    default: medium
    choices: [low, medium, high]
    label: Fallback effort
    description: 'Effort applied when the decider answer is unusable. Deliberately excludes max — a degraded turn must not be the expensive one.'
  context_turns:
    type: int
    default: 4
    label: Context turns
    description: How many preceding conversation turns are sent to the decider as recent context.
  route_per_turn:
    type: bool
    default: true
    label: Route every turn
    description: Off routes once per session instead of once per user turn.
  audit_enabled:
    type: bool
    default: true
    label: Audit log
    description: Append one JSONL record per routed turn under the plugin data directory.
  log_skips:
    type: bool
    default: true
    label: Log skipped turns
    description: Record why a turn was left unrouted (non-routed provider, unknown model, and so on).
  include_user_message_in_audit:
    type: bool
    default: false
    label: Include user message in audit
    description: Off keeps the audit free of conversation content. Turn on only for local debugging.
  grid:
    type: list
    default: null
    label: Routing grid override
    description: 'Optional list of entries, each "model-id: description", replacing the built-in six-model grid.'
  platform_overrides:
    type: dict
    default: null
    label: Per-surface routing policy
    description: 'Optional map of platform (cron, telegram, cli, ...) to the settings it overrides.'
  session_selection:
    type: dict
    default: null
    label: Session selection reconciliation
    description: 'Optional map with mode (off|warn|apply, default off), platforms (default [webui]) and provider_map (default anthropic -> claude-subscription-directsdk-experimental). With off the session row is never read; warn records a divergence; apply also reconciles a fail-open turn to the session''s own model and effort.'
  decider:
    type: str
    default: jev
    choices: [jev, openai_compatible, jev_console]
    label: Decider backend
    description: Pluggable decider backend ('jev', 'openai_compatible', or 'jev_console').
  decider_base_url:
    type: str
    default: ""
    label: Decider base URL
    description: Base URL for openai_compatible decider (e.g. https://opencode.ai/zen/go/v1).
  decider_model:
    type: str
    default: ""
    label: Decider model
    description: Model for openai_compatible decider (e.g. deepseek-v4.1-flash).
  decider_api_key_env:
    type: str
    default: ""
    label: Decider API key env var
    description: Env var name holding API key for openai_compatible decider.
  console_endpoint:
    type: str
    default: ""
    label: OpenCode Console SystemOne endpoint
    description: SystemOne endpoint for jev_console decider (defaults to https://opencode.ai/inference/systemone/v1/systemone).
  console_jev_model:
    type: str
    default: "jev-1.13-free"
    label: OpenCode Console primary Jev model
    description: Primary model for jev_console decider (defaults to jev-1.13-free).
  console_jev_fallback_model:
    type: str
    default: "jev-1.13"
    label: OpenCode Console fallback Jev model
    description: >-
      Paid second model the jev_console chain asks when the free primary fails technically. The
      default jev-1.13 costs money; the empty string disables that leg (it is not inert), and
      "none"/"false"/"off"/"disabled" mean the same.
  console_api_key_env:
    type: str
    default: ""
    label: OpenCode Console API key env var
    description: Env var name holding API key for jev_console decider (defaults to OPENCODE_CONSOLE_API_KEY).
  console_jev_commandcode_base_url:
    type: str
    default: ""
    label: CommandCode SystemOne endpoint (opt-in fallback)
    description: >-
      Complete HTTPS SystemOne endpoint used only after the jev_console chain fails technically,
      e.g. https://api.commandcode.ai/provider/v1/systemone. Empty disables the fallback. This
      upstream has no ZDR agreement — see docs/jev-decisions-api.md before enabling it.
  console_jev_commandcode_api_key_env:
    type: str
    default: ""
    label: CommandCode API key env var (opt-in fallback)
    description: >-
      Env var name holding the CommandCode key. Only read when
      console_jev_commandcode_base_url is set; empty then defaults to COMMANDCODE_API_KEY. The
      value is never read from config and never logged.
  console_jev_commandcode_model:
    type: str
    default: ""
    label: CommandCode decision model (opt-in fallback)
    description: >-
      Decision model id the fallback asks. Only read when console_jev_commandcode_base_url is
      set; empty then defaults to typesafe/jev.
  routable_providers:
    type: list
    default: [ollama-cloud]
    label: Routable providers
    description: List of provider ids the router is permitted to route.
  grids:
    type: dict
    default: null
    label: Per-provider routing grids
    description: >-
      Optional operator override of a route's choice set, as a map of provider id to a list of
      "model-id: description" lines. Leave it empty to use the route's built-in catalog (grid.py),
      which is the single source of the model ids and their descriptions; an entry outside the
      catalog is capped away.
  effort_maps:
    type: dict
    default: null
    label: Per-provider effort maps
    description: >-
      Optional operator override of a route's effort contract (accepted levels, overrides). The
      built-in policies already declare it for every route this plugin serves; declare a map only
      to narrow or widen one. A matched entry replaces the built-in policy wholesale.
  effort_criteria:
    type: dict
    default: null
    label: Effort rubric
    description: 'Optional map of effort level (low/medium/high/max) to the text the effort question shows for it. Overrides the built-in rubric level by level; an unknown level or empty text discards the whole knob and the built-in text applies.'
  effort_instructions:
    type: str
    default: ""
    label: Effort instructions
    description: Optional override of the effort question's instructions. Empty keeps the built-in rule ("lowest level that covers; raise for uncertainty, risk or irreversibility — never for size").
  confidence_threshold_per_decider:
    type: dict
    default: null
    label: Confidence threshold per decider
    description: Optional map of decider backend to confidence threshold.
