[pytest]
# This ini lives in tests/ on purpose: pytest takes this directory as rootdir.
# The plugin entry point is `__init__.py` at the repository ROOT (Hermes requires it beside
# plugin.yaml), which makes the repository root a package. If pytest takes the root as rootdir it
# tries to import that __init__.py as the package of the collected test modules and fails with
# "attempted relative import with no known parent package". Run the suite as `pytest -q tests`.
testpaths = .
addopts = -q --import-mode=importlib
pythonpath = .
norecursedirs = .venv .git __pycache__
