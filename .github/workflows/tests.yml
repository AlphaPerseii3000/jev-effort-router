name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml httpx

      - name: Test
        run: pytest -q tests

      - name: Validate the plugin manifest
        run: |
          python -c "import yaml,pathlib; m=yaml.safe_load(pathlib.Path('plugin.yaml').read_text(encoding='utf-8')); assert m['name']=='jev-effort-router'; assert pathlib.Path('__init__.py').is_file(); print('manifest ok:', m['version'])"
