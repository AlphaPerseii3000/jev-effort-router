[project]
name = "hermes-plugin-jev-effort-router"
version = "0.3.2"
description = "Hermes plugin — route each user turn to the best model and reasoning effort via TypeSafe Jev; ships an Ollama:Cloud profile and accepts operator-declared provider profiles."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]
