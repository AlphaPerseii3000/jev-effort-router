[project]
name = "hermes-plugin-jev-effort-router"
version = "0.2.0"
description = "Hermes plugin — route each user turn to an Ollama:cloud model and reasoning effort via TypeSafe Jev."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
